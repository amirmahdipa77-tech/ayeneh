<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<title>آینه — خبر ایران و جهان</title>
<meta name="description" content="آینه: تیترهای تازه خبرگزاری‌های ایران و جهان در یک اپ سبک و سریع، با متن کامل و ترجمه.">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d0c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta property="og:type" content="website">
<meta property="og:title" content="آینه — خبر ایران و جهان">
<meta property="og:description" content="تیترهای تازه خبرگزاری‌های ایران و جهان، با متن کامل و ترجمه.">
<meta property="og:locale" content="fa_IR">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%23e0442b'/><circle cx='50' cy='50' r='19' fill='none' stroke='white' stroke-width='9'/></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="app" id="app">

  <!-- ───────────────── list view ───────────────── -->
  <header class="appbar" id="appbar">
    <div class="appbar-row">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <h1>آینه</h1>
      </div>
      <div class="appbar-actions">
        <button class="icon-btn" id="btn-search" type="button" aria-label="جست‌وجو">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/></svg>
        </button>
        <button class="icon-btn" id="btn-filter" type="button" aria-label="فیلتر منابع">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"/></svg>
        </button>
        <button class="icon-btn" id="btn-theme" type="button" aria-label="پوسته">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 13.2A9 9 0 1 1 10.8 3a7 7 0 0 0 10.2 10.2Z"/></svg>
        </button>
      </div>
    </div>

    <div class="search-wrap" id="search-wrap" hidden>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/></svg>
        <input id="q" type="search" placeholder="جست‌وجو در تیترها…" autocomplete="off" aria-label="جست‌وجو">
        <button class="clear" id="q-clear" type="button" aria-label="پاک کردن">✕</button>
      </div>
    </div>

    <nav class="tabs" id="tabs" role="tablist" aria-label="دسته‌ها">
      <span class="tab-indicator" id="tab-indicator" aria-hidden="true"></span>
    </nav>
  </header>

  <div class="ptr" id="ptr" aria-hidden="true"><span class="ptr-spinner"></span></div>

  <main class="feed" id="feed" role="tabpanel"></main>
  <div class="sentinel" id="sentinel"></div>

  <footer class="foot" id="foot"></footer>

  <!-- ───────────────── reader view ───────────────── -->
  <section class="reader" id="reader" hidden aria-modal="true" role="dialog">
    <div class="reader-bar" id="reader-bar">
      <button class="icon-btn" id="reader-back" type="button" aria-label="بازگشت">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <div class="reader-progress"><span id="reader-progress"></span></div>
      <button class="icon-btn" id="reader-share" type="button" aria-label="اشتراک‌گذاری">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M5 14v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
      </button>
    </div>

    <div class="reader-scroll" id="reader-scroll">
      <div id="reader-body"></div>
    </div>

    <div class="reader-actions" id="reader-actions">
      <button class="pill pill-primary" id="btn-translate" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M8.5 6c0 4-2 7-4.5 9M6 10c1 2.5 3 4.5 5 5.5"/><path d="m13 20 3.5-8 3.5 8M14.5 17h5"/></svg>
        <span>ترجمه</span>
      </button>
      <button class="pill" id="btn-original" type="button" hidden>متن اصلی</button>
      <a class="pill pill-ghost" id="btn-source" href="#" target="_blank" rel="noopener noreferrer">منبع اصلی</a>
    </div>
  </section>

  <!-- ───────────────── sheets ───────────────── -->
  <div class="scrim" id="scrim" hidden></div>

  <div class="sheet" id="sheet-filter" hidden role="dialog" aria-label="فیلتر منابع">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2>منابع</h2>
      <button class="chip-btn" id="sources-all" type="button">همه</button>
    </div>
    <div class="sheet-body" id="sources-list"></div>
  </div>

  <div class="sheet" id="sheet-lang" hidden role="dialog" aria-label="زبان ترجمه">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h2>ترجمه به</h2></div>
    <div class="sheet-body lang-grid" id="lang-list"></div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>

<script src="assets/app.js" defer></script>
</body>
</html>
